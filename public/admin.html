<h1>RHODHOMES Admin</h1><input id=pw type=password placeholder='Admin password'><button onclick=loadAdmin()>View</button><button onclick=exportCSV()>Export CSV</button><input id=q placeholder='Search' oninput=loadAdmin()><select id=filter onchange=loadAdmin()><option value=''>All</option><option>Application</option><option>Enquiry</option><option>Footer Contact</option></select><div id=list></div><script>let DATA=[];async function loadAdmin(){let r=await fetch('/api/admin?password='+document.getElementById('pw').value+'&q='+document.getElementById('q').value+'&type='+document.getElementById('filter').value);let j=await r.json();DATA=j.items||[];document.getElementById('list').innerHTML=DATA.map(x=>'<div><b>'+x.ref+'</b> '+x.type+' '+x.name+' '+x.email+'</div>').join('')||'No data';}function exportCSV(){alert('Export '+DATA.length);}</script>
