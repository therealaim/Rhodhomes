<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>RHODHOMES Admin</title><style>body{font-family:system-ui;padding:14px;max-width:1100px;margin:auto;background:#f6f8f7}input,select,button{padding:11px;border-radius:10px;border:1px solid #ccc;font-size:15px}button{background:#0a3d2e;color:#fff;font-weight:800;border:0}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#0a3d2e;color:#fff;padding:14px;border-radius:12px;text-align:center}</style></head><body><h1>RHODHOMES Admin</h1><input id=pw type=password placeholder='Admin password' style='width:100%'><br><br><button onclick=loadAdmin()>View Submissions</button> <button onclick=exportCSV() style='background:#1db954'>Export CSV</button><br><br><input id=q placeholder='Search name / email / ref' oninput=loadAdmin() style='width:100%'><br><br><select id=filter onchange=loadAdmin() style='width:100%'><option value=''>All types</option><option>Application</option><option>Enquiry</option><option>Footer Contact</option></select><div class=grid><div class=stat><div id=sTotal>-</div><small>Total</small></div><div class=stat><div id=sApp>-</div><small>Applications</small></div><div class=stat><div id=sEnq>-</div><small>Enquiries</small></div></div><div id=list></div><script>let DATA=[];async function loadAdmin(){let pw=document.getElementById('pw').value;let q=document.getElementById('q').value;let f=document.getElementById('filter').value;let r=await fetch('/api/admin?password='+encodeURIComponent(pw)+'&q='+encodeURIComponent(q)+'&type='+encodeURIComponent(f));let j=await r.json();if(!r.ok){document.getElementById('list').innerHTML='<div class=card>'+(j.error||'Wrong password')+'</div>';return;}DATA=j.items||[];document.getElementById('sTotal').textContent=j.total||0;document.getElementById('sApp').textContent=j.applications||0;document.getElementById('sEnq').textContent=j.enquiries||0;document.getElementById('list').innerHTML=DATA.map((x,i)=>'<div class=card><b>'+(x.ref||'')+'</b> '+ (x.type||'')+'<br><b>'+(x.name||'')+'</b> - '+(x.email||'')+' - '+(x.phone||'')+'<pre>'+JSON.stringify(x.data||x,null,2)+'</pre></div>').join('')||'<div class=card>No submissions yet.</div>';}function exportCSV(){if(!DATA.length) return alert('No data');let rows=[['ref','type','name','email','phone','date']];DATA.forEach(x=>rows.push([x.ref,x.type,x.name,x.email,x.phone,x.date]));let csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rhodhomes.csv';a.click();}</script></body></html>
