<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent a Home - RHODHOMES</title><style>body{font-family:system-ui;max-width:700px;margin:auto;padding:16px;background:#f6f8f7}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:6px 0 12px}button{background:#1db954;color:#fff;padding:14px;border:0;border-radius:10px;font-weight:800;width:100%}.card{background:#fff;padding:18px;border-radius:16px}img{width:100%;height:220px;object-fit:cover;border-radius:14px}</style></head><body><a href="/">← Back to Home</a><h1>Rent a Home</h1><img src="/images/rent.jpg"><p>Tell us where you want to rent, your budget and move-in date. We will guide you on next steps.</p><div class="card"><form onsubmit="return sendEnquiry(event,'Rent')"><label>First name *</label><input name="first" required><label>Last name *</label><input name="last" required><label>Email *</label><input name="email" type="email" required><label>Phone (optional)</label><input name="phone"><label>State *</label><input name="state" required placeholder="e.g. California"><label>City *</label><input name="city" required><label>Budget / Message *</label><textarea name="message" required rows="4" placeholder="Budget, bedrooms, move-in date, anything we should know"></textarea><button>Send Enquiry</button><p id="msg"></p></form></div><script>async function sendEnquiry(e,type){e.preventDefault();var f=e.target;var d={type:type,first:f.first.value,last:f.last.value,name:f.first.value+' '+f.last.value,email:f.email.value,phone:f.phone.value,state:f.state.value,city:f.city.value,message:f.message.value};var r=await fetch('/api/enquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});var j=await r.json().catch(()=>({}));document.getElementById('msg').textContent=r.ok?'Sent! Your ref: '+(j.ref||''):'Could not send. Try again.';if(r.ok) f.reset();return false;}</script></body></html>
